<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button> </ion-menu-button>
    </ion-buttons>
    <ion-title>Stock Transfer</ion-title>
    <ion-buttons slot="end" class="addbtn" (click)="transferList()">
      <ion-icon name="list"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar color="dark">
    <div style="display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;">
      <span [style.background]="readerConnected ? '#2dd36f' : '#eb445b'" style="width:10px;height:10px;border-radius:50%;display:inline-block;"></span>
      <span *ngIf="readerConnected">Reader connected</span>
      <span *ngIf="!readerConnected">Reader disconnected</span>
    </div>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <div class="pagewrap">
    <form class="form" id="form" [formGroup]="stockForm">
      <div class="container">
        <!-- <select formControlName="productEntryId" class="container__input">
          <option *ngFor="let ref of products" [ngValue]="ref.productEntryId">
            {{ref.productName}}
          </option>
        </select> -->
        <input
          class="container__input"
          type="text"
          id="barcode"
          name="barcode"
          value=""
          required
          formControlName="barcode"
          (input)="calculateByteLength($event)"
          autofocus="true"
        />
        <label id="userLabel" for="productEntryId" class="container__label"
          >RFID Code</label
        >
        <ion-grid>
          <ion-row>
            <ion-col></ion-col>
            <ion-col>
              <!-- <ion-button color="danger"
                ><ion-icon slot="end" name="star"></ion-icon>
              </ion-button> -->
              <ion-button color="danger"
              (click)="clear()"><ion-icon name="close"></ion-icon
            ></ion-button>
            </ion-col>
            <ion-col>

              <ion-button (click)="getProduct()"><ion-icon name="arrow-redo"></ion-icon> </ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="productName"
          name="productName"
          value=""
          required
          formControlName="productName"

        />
        <label
          id="productName"
          for="productName"
          class="container__label"
          >Product Name</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="printName"
          name="printName"
          value=""
          required
          formControlName="printName"

        />
        <label
          id="printName"
          for="printName"
          class="container__label"
          >Print Name</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="brand"
          name="brand"
          value=""
          required
          formControlName="brand"

        />
        <label
          id="brand"
          for="brand"
          class="container__label"
          >Brand</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="category"
          name="category"
          value=""
          required
          formControlName="category"

        />
        <label
          id="category"
          for="category"
          class="container__label"
          >Category</label
        >
      </div>


      <div class="container">
        <input
          class="container__input"
          type="text"
          id="currentStock"
          name="currentStock"
          value=""
          required
          formControlName="currentStock"
        />
        <label id="currentStock" for="currentStock" class="container__label"
          >Quantity</label
        >
      </div>
      <div class="container">
        <!-- <input
          class="container__input"
          type="text"
          id="refRefListSourcePoint"
          name="refRefListSourcePoint"
          value=""
          required
          formControlName="refRefListSourcePoint"
        /> -->
        <select
          formControlName="refRefListSourcePoint"
          class="container__input"
        >
          <option *ngFor="let ref of refLists" [ngValue]="ref.referenceListId">
            {{ref.referenceListIdName}}
          </option>
        </select>
        <label
          id="userLabel"
          for="refRefListSourcePoint"
          class="container__label"
          >Source Point</label
        >
      </div>
      <div class="container">
        <!-- <input
          class="container__input"
          type="text"
          id="refRefListDestinationPoint"
          name="refRefListDestinationPoint"
          value=""
          required
          formControlName="refRefListDestinationPoint"
        /> -->
        <select
          formControlName="refRefListDestinationPoint"
          class="container__input"
        >
          <option [ngValue]="null" disabled selected="selected">
            Select Product
          </option>
          <option *ngFor="let ref of refLists" [ngValue]="ref.referenceListId">
            {{ref.referenceListIdName}}
          </option>
        </select>
        <label
          id="refRefListDestinationPoint"
          for="refRefListDestinationPoint"
          class="container__label"
          >Destination Point</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="approvedBy"
          name="approvedBy"
          value=""
          required
          formControlName="approvedBy"
        />
        <label id="approvedBy" for="approvedBy" class="container__label"
          >Approved By</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="date"
          id="date"
          name="date"
          value=""
          required
          formControlName="date"
        />
        <label id="date" for="date" class="container__label">Date</label>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="reason"
          name="reason"
          value=""
          formControlName="reason"
          required
        />
        <label id="reason" for="reason" class="container__label">Reason</label>
      </div>

      <button
        class="form__submit"
        id="submit"
        type="button"
        value="submit"
        (click)="transferEntry()"
      >
        Submit
      </button>
    </form>
  </div>
</ion-content>
