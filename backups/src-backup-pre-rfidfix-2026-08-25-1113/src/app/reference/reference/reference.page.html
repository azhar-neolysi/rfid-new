<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button> </ion-menu-button>
      <!-- <ion-icon name="add-sharp" slot="end"></ion-icon> -->
    </ion-buttons>
    <ion-title>Reference</ion-title>
    <ion-buttons slot="end" class="addbtn" (click)="addReference()">
      <!-- <ion-menu-button> </ion-menu-button> -->
      <ion-icon name="add-sharp" slot="end"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ion-card>
    <ion-input
      (ionChange)="search($event)"
      class="container__input"
      type="text"
      id="refName"
      name="refName"
      expand="full"
      placeholder="Reference Name"
    />
  </ion-card>

  <ion-card *ngFor="let ref of referenceItems">
    <ion-card-header>
      <ion-row>
        <ion-col
          ><ion-card-title
            >Reference Name: <ion-label>{{ref.name}}</ion-label></ion-card-title
          ></ion-col
        >
        <ion-col size="auto"
          ><ion-button color="danger" (click)="deleteRef(ref.referenceId)"
            ><ion-icon name="trash-sharp"></ion-icon></ion-button
        ></ion-col>
      </ion-row>

      <!-- <ion-card-subtitle></ion-card-subtitle> -->
    </ion-card-header>

    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col
            >Description: <ion-label>{{ref.description}}</ion-label></ion-col
          >
          <ion-col size="auto"
            ><ion-button (click)="editReference(ref.referenceId)">
              <ion-icon name="create-sharp"></ion-icon></ion-button
          ></ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
    <!-- <ion-grid>
      <ion-row>
        <ion-col
          ><ion-button> <ion-icon name="create-sharp"></ion-icon></ion-button
        ></ion-col>
        <ion-col
          ><ion-button color="danger" (click)="deleteRef(ref.referenceId)"
            ><ion-icon name="trash-sharp"></ion-icon></ion-button
        ></ion-col>
      </ion-row>
    </ion-grid> -->
  </ion-card>
</ion-content>
