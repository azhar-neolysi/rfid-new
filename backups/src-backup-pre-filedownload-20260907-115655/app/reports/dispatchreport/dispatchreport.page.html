
<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button> </ion-menu-button>
    </ion-buttons>
    <ion-title>Delivery Stock Report</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <div class="pagewrap">
    <form class="form" id="form" [formGroup]="reportForm">
      <div class="container">
        <input
          class="container__input"
          type="date"
          id="fromDate"
          name="fromDate"
          value=""
          formControlName="fromDate"
          [max]="maxDate"
        />
        <label id="userLabel" for="fromDate" class="container__label"
          >From Date</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="date"
          id="toDate"
          name="toDate"
          value=""
          formControlName="toDate"
          [max]="maxDate"
        />
        <label id="passLabel" for="toDate" class="container__label"
          >To Date</label
        >
      </div>

      <button class="form__submit" id="submit" type="button" value="submit" (click)="search()">
        Search
      </button>
    </form>
  </div>
</ion-content>
<ion-footer>
  <ion-button expand="block" (click)="exportToPdf()">Export to PDF</ion-button>
</ion-footer>
