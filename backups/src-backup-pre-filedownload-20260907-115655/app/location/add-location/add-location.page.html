<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="location"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ locationId ? 'Edit' : 'Add' }} Location</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="locationForm" (ngSubmit)="save()">
    <ion-item>
      <ion-label position="floating">Address Line 1 *</ion-label>
      <ion-input formControlName="address1" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Address Line 2</ion-label>
      <ion-input formControlName="address2" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Address Line 3</ion-label>
      <ion-input formControlName="address3" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Address Line 4</ion-label>
      <ion-input formControlName="address4" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">PIN Code</ion-label>
      <ion-input formControlName="pin" type="text"></ion-input>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top" type="submit">
      {{ locationId ? 'Update' : 'Create' }}
    </ion-button>
  </form>
</ion-content>
