<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button> </ion-menu-button>
    </ion-buttons>
    <ion-title>Sale</ion-title>
    <ion-buttons slot="end" class="addbtn" (click)="saleEntry()">
      <!-- <ion-menu-button> </ion-menu-button> -->
      <ion-icon name="add-sharp" slot="end"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">

  <ion-card *ngFor="let sale of saleList">
    <ion-card-header>
      <ion-row>
        <ion-col
          ><ion-card-title
            >Product Id:
            <ion-label>{{sale.productMasterId}}</ion-label></ion-card-title
          >
          <ion-card-title
            >Current Stock:
            <ion-label>{{sale.currentStock}}</ion-label></ion-card-title
          ></ion-col
        >
        <ion-col
          ><ion-button
            color="danger"
            (click)="deleteSale(sale.salesId)"
            ><ion-icon name="trash-sharp"></ion-icon></ion-button
        ></ion-col>
      </ion-row>

      <!-- <ion-card-subtitle></ion-card-subtitle> -->
    </ion-card-header>

    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col
            >Sales Date: <ion-label>{{sale.salesDate | date:'dd:MM:yyyy'}}</ion-label></ion-col
          >
          <ion-col
            ><ion-button (click)="editSale(sale.salesId)">
              <ion-icon name="create-sharp"></ion-icon></ion-button
          ></ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>
