<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Locations</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addLocation()">
        <ion-icon name="add-circle-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar
    [(ngModel)]="searchTerm"
    placeholder="Search locations..."
    debounce="300"
  ></ion-searchbar>

  <ion-list>
    <ion-item-sliding *ngFor="let loc of filteredLocations">
      <ion-item (click)="editLocation(loc)" button detail>
        <ion-label>
          <h2>{{ loc.address1 }}</h2>
          <p>{{ loc.address2 }} {{ loc.pin }}</p>
        </ion-label>
        <ion-note slot="end" color="medium">
          ID: {{ loc.locationId }}
        </ion-note>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteLocation(loc)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-text *ngIf="filteredLocations.length === 0" class="ion-text-center ion-padding">
    <p>No locations found</p>
  </ion-text>
</ion-content>
