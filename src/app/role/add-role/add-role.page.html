<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="role"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ roleId ? 'Edit' : 'Add' }} Role</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="roleForm" (ngSubmit)="save()">
    <ion-item>
      <ion-label position="floating">Role Name *</ion-label>
      <ion-input formControlName="roleName" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Description</ion-label>
      <ion-textarea formControlName="description" rows="3"></ion-textarea>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top" type="submit">
      {{ roleId ? 'Update' : 'Create' }}
    </ion-button>
  </form>
</ion-content>
