<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button> </ion-menu-button>
    </ion-buttons>
    <ion-title>Device Master</ion-title>
    <ion-buttons slot="end" (click)="excelUploadEnable()">
      <a href="assets/templates/device.xlsx" download class="upload-tpl" (click)="$event.stopPropagation(); downloadTemplate('device.xlsx', $event)" title="Download Template">
        <ion-icon name="document-text-outline" id="upload"></ion-icon>
      </a>
      <ion-icon name="cloud-upload-sharp" id="upload"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true"  *ngIf="!excelUpload">
  <div class="pagewrap">
    <form class="form" id="form" [formGroup]="deviceForm">
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="deviceCode"
          name="deviceCode"
          value=""
          required
          formControlName="deviceCode"
        />
        <label id="deviceCode" for="deviceCode" class="container__label"
          >Device ID</label
        >
        <span *ngIf="deviceForm.controls.deviceCode.invalid && deviceForm.controls.deviceCode.touched" class="field-error">Device ID is required</span>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="deviceName"
          name="deviceName"
          value=""
          required
          formControlName="deviceName"
        />
        <label id="deviceName" for="deviceName" class="container__label"
          >Device Name</label
        >
        <span *ngIf="deviceForm.controls.deviceName.invalid && deviceForm.controls.deviceName.touched" class="field-error">Device Name is required</span>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="deviceIpaddress"
          name="deviceIpaddress"
          value=""
          required
          formControlName="deviceIpaddress"
        />
        <label
          id="deviceIpaddress"
          for="deviceIpaddress"
          class="container__label"
          >IP Address</label
        >
        <span *ngIf="deviceForm.controls.deviceIpaddress.invalid && deviceForm.controls.deviceIpaddress.touched" class="field-error">IP Address is required</span>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="deviceMacaddress"
          name="deviceMacaddress"
          value=""
          required
          formControlName="deviceMacaddress"
        />
        <label
          id="deviceMacaddress"
          for="deviceMacaddress"
          class="container__label"
          >MAC Address</label
        >
        <span *ngIf="deviceForm.controls.deviceMacaddress.invalid && deviceForm.controls.deviceMacaddress.touched" class="field-error">MAC Address is required</span>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="imei"
          name="imei"
          value=""
          required
          formControlName="imei"
        />
        <label
          id="imei"
          for="imei"
          class="container__label"
          >IMEI</label
        >
        <span *ngIf="deviceForm.controls.imei.invalid && deviceForm.controls.imei.touched" class="field-error">IMEI is required</span>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="deviceModel"
          name="deviceModel"
          value=""
          required
          formControlName="deviceModel"
        />
        <label
          id="deviceModel"
          for="deviceModel"
          class="container__label"
          >Device Model</label
        >
        <span *ngIf="deviceForm.controls.deviceModel.invalid && deviceForm.controls.deviceModel.touched" class="field-error">Device Model is required</span>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="deviceType"
          name="deviceType"
          value=""
          required
          formControlName="deviceType"
        />
        <label id="deviceType" for="deviceType" class="container__label"
          >Device Type</label
        >
        <span *ngIf="deviceForm.controls.deviceType.invalid && deviceForm.controls.deviceType.touched" class="field-error">Device Type is required</span>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="refLocationId"
          name="refLocationId"
          value=""
          required
          formControlName="refLocationId"
        />
        <label id="refLocationId" for="refLocationId" class="container__label"
          >Location</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="deviceManufacturer"
          name="deviceManufacturer"
          value=""
          required
          formControlName="deviceManufacturer"
        />
        <label
          id="deviceManufacturer"
          for="deviceManufacturer"
          class="container__label"
          >Device Mfg</label
        >
        <span *ngIf="deviceForm.controls.deviceManufacturer.invalid && deviceForm.controls.deviceManufacturer.touched" class="field-error">Device Mfg is required</span>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="description"
          name="description"
          value=""
          formControlName="description"
        />
        <label id="description1" for="description" class="container__label"
          >Description</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="status"
          name="status"
          value=""
          required
          formControlName="status"
        />
        <label id="status" for="status" class="container__label"
          >status</label
        >
        <span *ngIf="deviceForm.controls.status.invalid && deviceForm.controls.status.touched" class="field-error">Status is required</span>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="password"
          id="devicePassword"
          name="devicePassword"
          value=""
          required
          formControlName="devicePassword"
        />
        <label id="devicePassword" for="devicePassword" class="container__label"
          >Password</label
        >
        <span *ngIf="deviceForm.controls.devicePassword.invalid && deviceForm.controls.devicePassword.touched" class="field-error">Password is required</span>
      </div>

      <button class="form__submit" id="submit" type="button" value="submit" (click)="addDevice()">
        Submit
      </button>
    </form>
  </div>
</ion-content>
<ion-content [fullscreen]="true" *ngIf="excelUpload">
  <div class="pagewrap">
    <form class="form" id="form">
      <div class="container">
        <input
          class="container__input"
          type="file"
          id=""
          name="tagId"
          value=""
          required
          (change)="onFileSelected($event)"
        />
        <label id="userLabel" for="tagId" class="container__label"
          >Excel</label
        >
      </div>

      <button class="form__submit" id="submit" type="button" value="submit" (click)="upload()">
        Upload
      </button>
    </form>
  </div>
</ion-content>
