<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button> </ion-menu-button>
    </ion-buttons>
    <ion-title>Product Entry</ion-title>
    <ion-buttons slot="end" (click)="excelUploadEnable()">
      <ion-icon name="cloud-upload-sharp" id="upload"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true" *ngIf="!excelUpload">
  <div class="pagewrap">
    <form class="form" id="form" [formGroup]="productForm">
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="productName"
          name="productName"
          value=""
          required
          formControlName="productName"
        />
        <label id="productName" for="productName" class="container__label"
          >Name</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="printName"
          name="printName"
          value=""
          required
          formControlName="printName"
        />
        <label id="printName" for="printName" class="container__label"
          >Print Name</label
        >
      </div>
      <div class="container">
        <input
        inputmode="none"
          class="container__input"
          type="text"
          id="rfidcode"
          name="rfidcode"
          value=""
          required
          formControlName="rfidcode"
          autofocus="true"
          (input)="calculateByteLength($event)"
        />
        <!-- <button (click)="clearRfid()" ></button> -->
        <label id="rfidcode" for="rfidcode" class="container__label"
          >RFID Code</label
        >
        <ion-grid>
          <ion-row>
            <ion-col></ion-col>
            <ion-col>
              <!-- <ion-button color="danger"
                ><ion-icon slot="end" name="star"></ion-icon>
              </ion-button> -->
            </ion-col>
            <ion-col>
              <ion-button color="danger"
                (click)="clear()"><ion-icon name="close"></ion-icon
              ></ion-button>
              <!-- <ion-button (click)="editSale()"><ion-icon name="arrow-redo"></ion-icon> </ion-button> -->
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="itemCode"
          name="itemCode"
          value=""
          required
          formControlName="itemCode"
        />
        <label id="itemCode" for="itemCode" class="container__label"
          >Item Code</label
        >
      </div>
      <div class="container">
        <input
          class="container__input"
          type="text"
          id="barCode"
          name="barCode"
          value=""
          required
          formControlName="barCode"
          inputmode="none"
        />
        <label id="userLabel" for="barCode" class="container__label"
          >Barcode</label
        >
      </div>

            {{ref.referenceListIdName}}

      <div class="container">

        <label id="closingQty" for="closingQty" class="container__label"
          >Closing Qty</label
        >

      <div class="container">

         <select formControlName="segmentName" class="container__input" (change)="getSegmentRef()">
          <option [ngValue]="null" disabled selected="selected">
            Select Segment
          </option>
          <option *ngFor="let ref of segments" [ngValue]="ref.segmentName">
            {{ref.segmentName}}
          </option>
        </select>
        <label id="segment" for="segment" class="container__label"
          >Segment</label
        >
      </div>
      <div class="container" *ngFor="let segment of segmentList; let i = index">
        <select  [formControlName]="i" [(ngModel)]="dynamicValues[i]"  name="segList"  class="container__input" (change)="addSegmentList($event,segment.element)">
          <option [ngValue]="null" disabled selected="selected">
            Select {{segment.element}}
          </option>
          <option *ngFor="let ref of segment.list" [value]="ref.referenceListId" >
            {{ref.referenceListName}}
          </option>
        </select>
        <label id="segment" for="segment" class="container__label"
          >{{segment.element}}</label
        >

<ion-content [fullscreen]="true" *ngIf="excelUpload">
  <div class="pagewrap">
    <form class="form" id="form">
      <div class="container">
        <input
          class="container__input"
          type="file"
          id=""
          name="tagId"
          value=""
          required
          (change)="onFileSelected($event)"
        />
        <label id="userLabel" for="tagId" class="container__label"
          >Excel</label
        >
      </div>

      <button class="form__submit" id="submit" type="button" value="submit" (click)="upload()">
        Upload
      </button>
    </form>
  </div>
</ion-content>
