<ion-header>
  <ion-toolbar color="primary">
    <ion-title>RFID Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <div class="login-logo">
      <img src="assets/logos/rfid-logo-light.png" alt="Neo RFID" />
      <h2>Neo RFID</h2>
    </div>

    <ion-item>
      <ion-label position="floating">Username</ion-label>
      <ion-input [(ngModel)]="userName" type="text" autocomplete="username"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Password</ion-label>
      <ion-input [(ngModel)]="password" type="password" autocomplete="current-password"></ion-input>
    </ion-item>

    <ion-button
      expand="block"
      class="ion-margin-top"
      (click)="login()"
      [disabled]="loading"
    >
      <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
      Login
    </ion-button>
  </div>
</ion-content>
